<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Mini Translator (English ↔ Hebrew)</h2>
  
  <!-- Row with text input + paste button -->
  <div class="input-row">
    <input 
      type="text" 
      id="textInput" 
      placeholder="Type or paste text..."
    />
    <button 
      id="pasteBtn" 
      title="Paste from Clipboard"
    >
      📋
    </button>
  </div>

  <!-- "Translate" button -->
  <button id="translateBtn">תרגם</button>

  <!-- Area to show the translation result -->
  <div id="resultBox"></div>

  <!-- Include our script -->
  <script src="script.js"></script>
</body>
</html>
